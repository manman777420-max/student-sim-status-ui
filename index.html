<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>学生时代模拟器 · 状态栏</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4efe6;
      --paper: rgba(255, 253, 248, 0.96);
      --paper-2: #f8f3ea;
      --ink: #3c3833;
      --muted: #8c8378;
      --line: #ded5c9;
      --accent: #748c78;
      --accent-soft: #e6ede5;
      --warm: #b58a66;
      --danger: #a96f69;
      --shadow: 0 10px 30px rgba(63, 52, 40, 0.08);
    }

    body {
      margin: 0;
      padding: 14px;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.8), transparent 35%),
        var(--bg);
      color: var(--ink);
      font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    /* =========================
       顶部
       ========================= */

    .hero {
      padding: 20px 20px 17px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(
          135deg,
          rgba(230,237,229,.9),
          rgba(255,253,248,.95)
        );
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .date {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .time {
      margin-top: 3px;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
    }

    .weather {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      color: var(--muted);
      font-size: 12px;
    }

    .location {
      margin-top: 14px;
      font-size: 14px;
    }

    .period {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       人物概要
       ========================= */

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-size: 19px;
      font-weight: 700;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .mood {
      align-self: center;
      padding: 7px 11px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: #536858;
      font-size: 13px;
      white-space: nowrap;
    }

    /* =========================
       核心状态
       ========================= */

    .core {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .core-card {
      padding: 10px;
      border-radius: 12px;
      background: var(--paper-2);
    }

    .core-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .core-value {
      color: var(--ink);
      font-weight: 700;
    }

    .bar {
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: #e5ddd2;
    }

    .bar > div {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s ease;
    }

    /* =========================
       Tab
       ========================= */

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px;
      gap: 5px;
      border-bottom: 1px solid var(--line);
      background: rgba(248,243,234,.65);
    }

    .tab {
      border: 0;
      padding: 9px 6px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .tab:hover {
      background: rgba(255,255,255,.7);
    }

    .tab.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(60,50,40,.06);
      font-weight: 600;
    }

    .content {
      min-height: 220px;
      padding: 18px 20px 21px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       通用布局
       ========================= */

    .section-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .1em;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 11px 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      text-align: center;
    }

    .stat-name {
      color: var(--muted);
      font-size: 10px;
    }

    .stat-value {
      margin-top: 3px;
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .info-list {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .info-label {
      color: var(--muted);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #5c6e60;
      font-size: 11px;
    }

    /* =========================
       本轮变化
       ========================= */

    .change-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .change-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper-2);
      font-size: 11px;
      line-height: 1.25;
    }

    .change-chip.positive {
      border-color: #cddccd;
      background: #edf4ec;
      color: #54705b;
    }

    .change-chip.negative {
      border-color: #e1ceca;
      background: #f7ecea;
      color: var(--danger);
    }

    .change-chip.neutral {
      color: var(--muted);
    }

    .change-delta {
      font-family: Georgia, serif;
      font-weight: 700;
    }

    /* =========================
       天赋卡片
       ========================= */

    .talent-list {
      display: grid;
      gap: 8px;
    }

    .talent-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper-2);
    }

    .talent-card summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      cursor: pointer;
      list-style: none;
      font-size: 12px;
      font-weight: 600;
    }

    .talent-card summary::-webkit-details-marker {
      display: none;
    }

    .talent-card summary::after {
      content: "＋";
      margin-left: auto;
      color: var(--muted);
      font-weight: 400;
    }

    .talent-card[open] summary::after {
      content: "－";
    }

    .talent-rank {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #586d5d;
      font-size: 10px;
    }

    .talent-description {
      padding: 0 12px 11px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* =========================
       关系
       ========================= */

    .relation-list {
      display: grid;
      gap: 9px;
    }

    .relation {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .relation-name {
      font-size: 13px;
      font-weight: 600;
    }

    .relation-type {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .favor {
      align-self: center;
      min-width: 36px;
      padding: 5px 7px;
      border-radius: 8px;
      background: var(--paper-2);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .favor.positive {
      color: #56725d;
    }

    .favor.negative {
      color: var(--danger);
    }

    /* =========================
       背包
       ========================= */

    .item-list {
      display: grid;
      gap: 9px;
    }

    .item {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .item-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .empty {
      padding: 35px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .footer {
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      color: #aaa096;
      text-align: center;
      font-size: 9px;
      letter-spacing: .08em;
    }

    .hidden {
      display: none !important;
    }

    .registration-panel {
      padding: 22px;
    }

    .registration-heading {
      margin-bottom: 18px;
    }

    .registration-title {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 25px;
      font-weight: 600;
    }

    .registration-subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .form-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-grid.attributes-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      background: rgba(255,255,255,.72);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.6;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(116,140,120,.12);
    }

    .age-preview,
    .form-note,
    .form-message {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .form-message {
      min-height: 18px;
      margin-top: 12px;
    }

    .form-message.error {
      color: var(--danger);
    }

    .form-message.success {
      color: #56725d;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 15px;
    }

    .button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      background: var(--paper-2);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .footer-button {
      margin-left: 8px;
      border: 0;
      background: transparent;
      color: #8d9d90;
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .panel {
        border-radius: 14px;
      }

      .core {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .registration-panel {
        padding: 17px 14px;
      }

      .form-grid,
      .form-grid.attributes-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero,
      .summary,
      .core,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <section class="panel registration-panel hidden" id="registration-panel">
      <form id="registration-form" novalidate>
        <div class="registration-heading">
          <h1 class="registration-title">入学登记表</h1>
          <p class="registration-subtitle">
            这些内容会直接写入当前聊天存档，不经过正文模型识别。完成后将自动进入状态页面。
          </p>
        </div>

        <section class="form-section">
          <h3 class="section-title">基本资料</h3>
          <div class="form-grid">
            <div class="field">
              <label for="reg-name">姓名 *</label>
              <input id="reg-name" maxlength="30" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="reg-gender">性别 *</label>
              <select id="reg-gender" required>
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="field">
              <label for="reg-birthday">出生日期 *</label>
              <input id="reg-birthday" type="date" required />
              <div class="age-preview" id="reg-age-preview">开局年龄：—</div>
            </div>
            <div class="field">
              <label for="reg-height">身高（cm，可选）</label>
              <input id="reg-height" type="number" min="30" max="250" step="0.1" />
            </div>
            <div class="field">
              <label for="reg-weight">体重（kg，可选）</label>
              <input id="reg-weight" type="number" min="2" max="300" step="0.1" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3 class="section-title">主要属性</h3>
          <div class="form-grid attributes-grid">
            <div class="field"><label for="reg-iq">智商</label><input id="reg-iq" type="number" min="0" max="900" value="50" required /></div>
            <div class="field"><label for="reg-eq">情商</label><input id="reg-eq" type="number" min="0" max="900" value="50" required /></div>
            <div class="field"><label for="reg-physique">体魄</label><input id="reg-physique" type="number" min="0" max="900" value="50" required /></div>
            <div class="field"><label for="reg-charm">魅力</label><input id="reg-charm" type="number" min="0" max="900" value="50" required /></div>
            <div class="field"><label for="reg-luck">幸运</label><input id="reg-luck" type="number" min="0" max="900" value="50" required /></div>
          </div>
          <div class="form-note" style="margin-top:8px;">属性会原样写入，后续上限仍由世界书阶段规则控制。</div>
        </section>

        <section class="form-section">
          <h3 class="section-title">天赋与外观</h3>
          <div class="form-grid">
            <div class="field full">
              <label for="reg-talents">天赋（每行一项）</label>
              <textarea id="reg-talents" placeholder="例：天生聪慧（A级）：学习效率提升&#10;天生丽质（S级）：魅力成长效率提升"></textarea>
            </div>
            <div class="field">
              <label for="reg-clothes">初始衣着</label>
              <input id="reg-clothes" maxlength="200" />
            </div>
            <div class="field">
              <label for="reg-temperament">初始气质</label>
              <input id="reg-temperament" maxlength="200" />
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3 class="section-title">家庭资料（可选）</h3>
          <div class="form-grid">
            <div class="field"><label for="reg-father-name">父亲姓名</label><input id="reg-father-name" maxlength="30" /></div>
            <div class="field"><label for="reg-mother-name">母亲姓名</label><input id="reg-mother-name" maxlength="30" /></div>
            <div class="field"><label for="reg-income">父母收入水平</label><input id="reg-income" maxlength="100" /></div>
            <div class="field"><label for="reg-education">教育风格</label><input id="reg-education" maxlength="200" /></div>
            <div class="field full">
              <label for="reg-parent-personality">父母性格（可用顿号或换行分隔）</label>
              <textarea id="reg-parent-personality"></textarea>
            </div>
          </div>
        </section>

        <div class="form-message" id="registration-message"></div>
        <div class="form-actions">
          <button class="button hidden" id="registration-cancel" type="button">取消修改</button>
          <button class="button primary" id="registration-submit" type="submit">开始游戏</button>
        </div>
      </form>
    </section>

    <section class="panel" id="status-panel">

      <!-- 顶部世界信息 -->
      <header class="hero">

        <div class="hero-top">
          <div>
            <div class="date" id="date">2003-08-27</div>
            <div class="time" id="time">23:45</div>
          </div>

          <div class="weather" id="weather">晴</div>
        </div>

        <div class="location" id="location">
          阳光小学 / 教学楼前报名处
        </div>

        <div class="period" id="period">
          小学新生报名日
        </div>

      </header>


      <!-- 主角概要 -->
      <section class="summary">

        <div>
          <div class="name" id="player-name">未登记</div>

          <div class="meta">
            <span id="player-age">7岁</span>
            ·
            <span id="player-gender">未登记</span>
            ·
            阅历
            <span id="experience">20</span>
          </div>
        </div>

        <div class="mood" id="mood">
          平静释然
        </div>

      </section>


      <!-- 四项核心状态 -->
      <section class="core" id="core-status"></section>


      <!-- Tabs -->
      <nav class="tabs">

        <button class="tab active" data-page="character">
          角色
        </button>

        <button class="tab" data-page="school">
          学校
        </button>

        <button class="tab" data-page="relations">
          关系
        </button>

        <button class="tab" data-page="items">
          背包
        </button>

      </nav>


      <section class="content">

        <!-- 角色 -->
        <div class="page active" id="page-character">

          <h3 class="section-title">主要属性</h3>

          <div class="stat-grid" id="attributes"></div>

          <h3 class="section-title" style="margin-top:20px;">
            本轮变化
          </h3>

          <div class="change-list" id="turn-changes"></div>

          <h3 class="section-title" style="margin-top:20px;">
            当前状态
          </h3>

          <div class="info-list" id="condition-info"></div>

          <div class="tag-list" id="status-tags"></div>

          <h3 class="section-title" style="margin-top:20px;">
            天赋技能
          </h3>

          <div class="talent-list" id="talent-list"></div>

        </div>


        <!-- 学校 -->
        <div class="page" id="page-school">

          <h3 class="section-title">校园信息</h3>

          <div class="info-list" id="school-info"></div>

        </div>


        <!-- 关系 -->
        <div class="page" id="page-relations">

          <h3 class="section-title">家庭</h3>

          <div class="relation-list" id="family-relations"></div>

          <h3 class="section-title" style="margin-top:20px;">
            人物关系
          </h3>

          <div class="relation-list" id="npc-relations"></div>

        </div>


        <!-- 背包 -->
        <div class="page" id="page-items">

          <h3 class="section-title">
            持有物品
          </h3>

          <div class="item-list" id="item-list"></div>

        </div>

      </section>


      <footer class="footer">
        STUDENT ERA · STATUS
        <button type="button" class="footer-button" id="edit-registration">修改登记资料</button>
      </footer>

    </section>
  </main>


  <script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const clamp = (n, min = 0, max = 100) => {
    n = Number(n);
    return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : min;
  };
  const text = (v, fallback = "—") =>
    v === undefined || v === null || v === "" ? fallback : String(v);
  const escapeHTML = value =>
    text(value, "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  let currentData = null;
  let hasReceivedRealData = false;
  let registrationPopulated = false;
  let registrationEditing = false;
  let registrationSubmitting = false;

  function parseDateParts(value) {
    const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return null;
    return { year: Number(match[1]), month: Number(match[2]), day: Number(match[3]) };
  }

  function calculateAge(birthday, currentDate) {
    const birth = parseDateParts(birthday);
    const current = parseDateParts(currentDate);
    if (!birth || !current) return null;
    let age = current.year - birth.year;
    if (current.month < birth.month || (current.month === birth.month && current.day < birth.day)) age--;
    return Number.isInteger(age) && age >= 0 ? age : null;
  }

  function updateAgePreview() {
    const age = calculateAge($("reg-birthday")?.value, currentData?.world?.date || "2003-08-27");
    setText("reg-age-preview", age === null ? "开局年龄：—" : `当前剧情日期年龄：${age}岁`);
  }

  function populateRegistration(data, force = false) {
    if (registrationPopulated && !force) return;
    const player = data?.player || {};
    const attrs = data?.attributes || {};
    const growth = data?.growth || {};
    const appearance = data?.appearance || {};
    const family = data?.family || {};

    $("reg-name").value = player.name === "未登记" ? "" : text(player.name, "");
    const gender = text(player.gender, "");
    if ([...$("reg-gender").options].some(option => option.value === gender)) {
      $("reg-gender").value = gender;
    } else {
      $("reg-gender").value = gender ? "其他" : "";
    }
    $("reg-birthday").value = /^\d{4}-\d{2}-\d{2}$/.test(text(player.birthday, ""))
      ? player.birthday
      : "1996-08-27";
    $("reg-height").value = Number.isFinite(Number(appearance.height)) ? appearance.height : "";
    $("reg-weight").value = Number.isFinite(Number(appearance.weight)) ? appearance.weight : "";
    $("reg-iq").value = text(attrs.iq, 50);
    $("reg-eq").value = text(attrs.eq, 50);
    $("reg-physique").value = text(attrs.physique, 50);
    $("reg-charm").value = text(attrs.charm, 50);
    $("reg-luck").value = text(attrs.luck, 50);
    $("reg-talents").value = normalizeTalents(growth.talents).join("\n");
    $("reg-clothes").value = text(appearance.clothes, "") === "—" ? "" : text(appearance.clothes, "");
    $("reg-temperament").value = text(appearance.temperament, "") === "—" ? "" : text(appearance.temperament, "");
    $("reg-father-name").value = text(family.father?.name, "") === "父亲" ? "" : text(family.father?.name, "");
    $("reg-mother-name").value = text(family.mother?.name, "") === "母亲" ? "" : text(family.mother?.name, "");
    $("reg-income").value = text(family.income_level, "") === "—" ? "" : text(family.income_level, "");
    $("reg-education").value = text(family.education_style, "") === "—" ? "" : text(family.education_style, "");
    $("reg-parent-personality").value = text(family.parent_personality, "") === "—" ? "" : text(family.parent_personality, "");

    registrationPopulated = true;
    updateAgePreview();
  }

  function showRegistration(data, editing = false) {
    registrationEditing = editing;
    populateRegistration(data, editing);
    $("registration-panel").classList.remove("hidden");
    $("status-panel").classList.add("hidden");
    $("registration-cancel").classList.toggle("hidden", !editing);
    $("registration-submit").textContent = editing ? "保存修改" : "开始游戏";
    setRegistrationMessage("");
    requestHeightReport();
  }

  function showStatus() {
    registrationEditing = false;
    $("registration-panel").classList.add("hidden");
    $("status-panel").classList.remove("hidden");
    requestHeightReport();
  }

  function setRegistrationMessage(message, kind = "") {
    const element = $("registration-message");
    element.textContent = message || "";
    element.className = `form-message${kind ? ` ${kind}` : ""}`;
  }

  const demoData = {
    world: {
      date: "2003-08-27",
      time: "23:45",
      location: "阳光小学 / 教学楼前报名处",
      weather: "晴",
      period: "小学新生报名日"
    },
    player: {
      name: "未登记",
      gender: "未登记",
      age: 7,
      age_text: "7岁",
      birthday: "—"
    },
    attributes: { iq: 50, eq: 50, physique: 50, charm: 50, luck: 50 },
    condition: {
      health: 100, energy: 100, stress: 4, happiness: 66,
      satiety: 80, cleanliness: 80, mood: "平静释然",
      sleeping: true, temp_status: "无", perm_status: "无"
    },
    growth: { experience: 20, talents: ["天生丽质（S级）：魅力成长效率+100%；初次见面获得额外优势", "天生聪慧（A级）：学习行动效率+80%"] },
    turn_changes: [{ label: "魅力", delta: 2 }, { label: "精力", delta: -5 }],
    appearance: { height: "—", weight: "—", clothes: "—", temperament: "—" },
    family: {
      income_level: "—", education_style: "—", parent_personality: "—",
      father: { name: "江父", relation: "父亲", favor: 70, impression: "" },
      mother: { name: "江母", relation: "母亲", favor: 72, impression: "" }
    },
    school: {
      school_name: "阳光小学", stage: "小学", grade: 1, semester: "入学前",
      class_name: "—", academic_level: "未评定", action_left: 2, action_total: 2
    },
    resources: { money: 0, items: [] },
    relationships: [
      { name: "李小萌", relation: "前桌同学", favor: 1, impression: "", met: true },
      { name: "王浩", relation: "男生头目", favor: -2, impression: "", met: true }
    ]
  };

  function setText(id, value, fallback = "—") {
    const el = $(id);
    if (el) el.textContent = text(value, fallback);
  }

  function row(label, value) {
    return `<div class="info-row"><span class="info-label">${escapeHTML(label)}</span><span>${escapeHTML(value)}</span></div>`;
  }

  function favorClass(value) {
    const n = Number(value) || 0;
    return n > 0 ? "positive" : n < 0 ? "negative" : "";
  }

  function relationCard(person) {
    if (!person) return "";
    const favor = Number(person.favor) || 0;
    const impression = text(person.impression, "");
    return `
      <div class="relation">
        <div>
          <div class="relation-name">${escapeHTML(text(person.name, "未命名"))}</div>
          <div class="relation-type">${escapeHTML(text(person.relation, "认识的人"))}</div>
          ${impression ? `<div class="item-description">${escapeHTML(impression)}</div>` : ""}
        </div>
        <div class="favor ${favorClass(favor)}">${favor}</div>
      </div>`;
  }

  function renderCore(condition = {}) {
    const items = [
      ["健康", condition.health],
      ["精力", condition.energy],
      ["压力", condition.stress],
      ["快乐", condition.happiness]
    ];
    $("core-status").innerHTML = items.map(([label, value]) => {
      const n = clamp(value);
      return `
        <div class="core-card">
          <div class="core-head">
            <span>${label}</span>
            <span class="core-value">${escapeHTML(text(value, 0))}</span>
          </div>
          <div class="bar"><div style="width:${n}%"></div></div>
        </div>`;
    }).join("");
  }

  function normalizeTalents(value) {
    if (Array.isArray(value)) return value.filter(Boolean).map(String);
    const single = text(value, "").trim();
    return single && single !== "暂无" ? [single] : [];
  }

  function parseTalent(value) {
    const raw = text(value, "").trim();
    const match = raw.match(/^(.+?)(?:[（(]([SABCD])级[）)])?(?:[：:]([\s\S]*))?$/i);
    return {
      name: (match?.[1] || raw || "未命名天赋").trim(),
      rank: (match?.[2] || "").toUpperCase(),
      description: (match?.[3] || "").trim()
    };
  }

  function renderTalents(value) {
    const talents = normalizeTalents(value).map(parseTalent);
    $("talent-list").innerHTML = talents.length
      ? talents.map(talent => `
          <details class="talent-card">
            <summary>
              ${talent.rank ? `<span class="talent-rank">${escapeHTML(talent.rank)}级</span>` : ""}
              <span>${escapeHTML(talent.name)}</span>
            </summary>
            <div class="talent-description">${escapeHTML(talent.description || "暂无详细效果说明")}</div>
          </details>`).join("")
      : `<div class="empty">暂无天赋技能</div>`;
  }

  function renderTurnChanges(changes) {
    const list = Array.isArray(changes) ? changes : [];
    $("turn-changes").innerHTML = list.length
      ? list.map(change => {
          const delta = Number(change.delta);
          const hasDelta = Number.isFinite(delta);
          const kind = hasDelta ? (delta > 0 ? "positive" : delta < 0 ? "negative" : "neutral") : "neutral";
          const value = hasDelta
            ? `${delta > 0 ? "+" : ""}${delta}`
            : text(change.text, "已更新");
          return `<span class="change-chip ${kind}">
            <span>${escapeHTML(text(change.label, "状态"))}</span>
            <span class="change-delta">${escapeHTML(value)}</span>
          </span>`;
        }).join("")
      : `<span class="change-chip neutral">本轮暂无数值变化</span>`;
  }

  function renderCharacter(data) {
    const a = data.attributes || {};
    const c = data.condition || {};
    const g = data.growth || {};
    const ap = data.appearance || {};

    const attrs = [
      ["智商", a.iq], ["情商", a.eq], ["体魄", a.physique],
      ["魅力", a.charm], ["幸运", a.luck]
    ];
    $("attributes").innerHTML = attrs.map(([name, value]) => `
      <div class="stat">
        <div class="stat-name">${name}</div>
        <div class="stat-value">${escapeHTML(text(value, 0))}</div>
      </div>`).join("");

    $("condition-info").innerHTML = [
      row("饱腹", text(c.satiety, 0)),
      row("清洁", text(c.cleanliness, 0)),
      row("睡眠", c.sleeping === true ? "睡眠中" : "清醒"),
      row("零花钱", text(data.resources?.money, 0)),
      row("身高", text(ap.height)),
      row("体重", text(ap.weight)),
      row("衣着", text(ap.clothes)),
      row("气质", text(ap.temperament))
    ].join("");

    const tags = [];
    const temp = text(c.temp_status, "无");
    const perm = text(c.perm_status, "无");
    if (temp !== "无" && temp !== "—") tags.push(temp);
    if (perm !== "无" && perm !== "—") tags.push(perm);
    $("status-tags").innerHTML = tags.length
      ? tags.map(v => `<span class="tag">${escapeHTML(v)}</span>`).join("")
      : `<span class="tag">当前无特殊状态</span>`;
  }

  function renderSchool(data) {
    const s = data.school || {};
    $("school-info").innerHTML = [
      row("学校", text(s.school_name)),
      row("阶段", text(s.stage)),
      row("年级", text(s.grade)),
      row("学期", text(s.semester)),
      row("班级", text(s.class_name)),
      row("学业水平", text(s.academic_level)),
      row("行动次数", `${text(s.action_left, 0)} / ${text(s.action_total, 0)}`)
    ].join("");
  }

  function renderRelations(data) {
    const f = data.family || {};
    const family = [f.father, f.mother].filter(Boolean);
    $("family-relations").innerHTML = family.length
      ? family.map(relationCard).join("")
      : `<div class="empty">暂无家庭关系数据</div>`;

    const npcs = Array.isArray(data.relationships)
      ? data.relationships.filter(p => p && p.met !== false)
      : [];
    $("npc-relations").innerHTML = npcs.length
      ? npcs.map(relationCard).join("")
      : `<div class="empty">暂无人物关系</div>`;
  }

  function renderItems(data) {
    const items = Array.isArray(data.resources?.items) ? data.resources.items : [];
    $("item-list").innerHTML = items.length
      ? items.map(item => `
          <div class="item">
            <div class="item-head">
              <span>${escapeHTML(text(item.name, "未命名物品"))}</span>
              <span>× ${escapeHTML(text(item.count, 0))}</span>
            </div>
            ${item.description ? `<div class="item-description">${escapeHTML(item.description)}</div>` : ""}
          </div>`).join("")
      : `<div class="empty">背包里暂时没有物品</div>`;
  }

  function renderStudentStatus(data) {
    if (!data || typeof data !== "object") return;
    currentData = data;

    if (data.registration?.required === true && !registrationEditing) {
      showRegistration(data, false);
    } else if (data.registration?.required !== true && !registrationEditing) {
      showStatus();
    }

    const w = data.world || {};
    const p = data.player || {};
    const c = data.condition || {};
    const g = data.growth || {};

    setText("date", w.date);
    setText("time", w.time);
    setText("weather", w.weather);
    setText("location", w.location);
    setText("period", w.period);
    setText("player-name", p.name, "未登记");
    setText("player-age", p.age_text || (p.age !== undefined ? `${p.age}岁` : "—"));
    setText("player-gender", p.gender, "未登记");
    setText("experience", g.experience, 0);
    setText("mood", c.mood);

    renderCore(c);
    renderCharacter(data);
    renderTurnChanges(data.turn_changes);
    renderTalents(g.talents);
    renderSchool(data);
    renderRelations(data);
    renderItems(data);

    requestHeightReport();
  }

  window.renderStudentStatus = renderStudentStatus;

  function activatePage(page) {
    document.querySelectorAll(".tab").forEach(button => {
      button.classList.toggle("active", button.dataset.page === page);
    });
    document.querySelectorAll(".page").forEach(panel => {
      panel.classList.toggle("active", panel.id === `page-${page}`);
    });
    requestHeightReport();
  }

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => activatePage(button.dataset.page));
  });

  function isValidStudentStatusData(data) {
    return !!(
      data &&
      typeof data === "object" &&
      !Array.isArray(data) &&
      data.world && typeof data.world === "object" &&
      data.player && typeof data.player === "object" &&
      data.condition && typeof data.condition === "object" &&
      data.attributes && typeof data.attributes === "object"
    );
  }

  function notifyParentReady() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: "student-sim-status-ui",
        type: "STATUS_UI_READY",
        version: "1.6-UI"
      }, "*");
    }
  }

  let heightTimer = null;
  function reportHeight() {
    if (!(window.parent && window.parent !== window)) return;
    const panel = document.querySelector(".panel");
    const bodyHeight = Math.ceil(document.documentElement.scrollHeight);
    const panelHeight = panel ? Math.ceil(panel.getBoundingClientRect().bottom + 14) : bodyHeight;
    const height = Math.max(300, bodyHeight, panelHeight);
    window.parent.postMessage({
      source: "student-sim-status-ui",
      type: "STATUS_HEIGHT",
      version: "1.6-UI",
      height
    }, "*");
  }
  function requestHeightReport() {
    clearTimeout(heightTimer);
    heightTimer = setTimeout(reportHeight, 30);
  }

  function registrationPayloadFromForm() {
    return {
      name: $("reg-name").value,
      gender: $("reg-gender").value,
      birthday: $("reg-birthday").value,
      attributes: {
        iq: $("reg-iq").value,
        eq: $("reg-eq").value,
        physique: $("reg-physique").value,
        charm: $("reg-charm").value,
        luck: $("reg-luck").value
      },
      talents: $("reg-talents").value.split(/\n+/).map(value => value.trim()).filter(Boolean),
      appearance: {
        height: $("reg-height").value,
        weight: $("reg-weight").value,
        clothes: $("reg-clothes").value,
        temperament: $("reg-temperament").value
      },
      family: {
        father_name: $("reg-father-name").value,
        mother_name: $("reg-mother-name").value,
        income_level: $("reg-income").value,
        education_style: $("reg-education").value,
        parent_personality: $("reg-parent-personality").value
      }
    };
  }

  $("reg-birthday").addEventListener("change", updateAgePreview);

  $("registration-form").addEventListener("submit", event => {
    event.preventDefault();
    if (registrationSubmitting) return;

    if (!event.currentTarget.reportValidity()) {
      setRegistrationMessage("请补全必填项目并检查数字范围。", "error");
      requestHeightReport();
      return;
    }

    if (!(window.parent && window.parent !== window)) {
      setRegistrationMessage("当前页面没有连接到酒馆状态栏系统。", "error");
      return;
    }

    registrationSubmitting = true;
    $("registration-submit").disabled = true;
    setRegistrationMessage("正在保存登记资料……");

    window.parent.postMessage({
      source: "student-sim-status-ui",
      type: "REGISTRATION_SUBMIT",
      version: "1.6-UI",
      payload: registrationPayloadFromForm()
    }, "*");
  });

  $("registration-cancel").addEventListener("click", () => {
    registrationPopulated = false;
    showStatus();
  });

  $("edit-registration").addEventListener("click", () => {
    if (currentData) showRegistration(currentData, true);
  });

  window.addEventListener("message", event => {
    const message = event.data;
    if (!message || typeof message !== "object") return;
    if (message.source !== "student-sim") return;

    if (message.type === "REGISTRATION_RESULT") {
      registrationSubmitting = false;
      $("registration-submit").disabled = false;

      if (message.ok === true) {
        registrationEditing = false;
        registrationPopulated = false;
        setRegistrationMessage(message.message || "登记成功。", "success");
      } else {
        setRegistrationMessage(message.message || "登记失败，请检查填写内容。", "error");
      }

      requestHeightReport();
      return;
    }

    if (message.type !== "STATUS_UPDATE") return;

    const data = message.payload;
    if (!isValidStudentStatusData(data)) {
      console.warn("[学生时代模拟器][远程状态栏] 收到的数据格式不合法：", data);
      return;
    }

    try {
      renderStudentStatus(data);
      hasReceivedRealData = true;
      document.body.dataset.statusSource = "live";
      console.log("[学生时代模拟器][远程状态栏] 已接收真实状态数据：", data);
    } catch (error) {
      console.error("[学生时代模拟器][远程状态栏] 渲染真实数据失败：", error);
    }
  });

  window.addEventListener("load", requestHeightReport);
  window.addEventListener("resize", requestHeightReport);

  if ("ResizeObserver" in window) {
    new ResizeObserver(requestHeightReport).observe(document.querySelector(".panel"));
  }

  renderStudentStatus(demoData);
  document.body.dataset.statusSource = "demo";
  activatePage("character");
  notifyParentReady();

  console.log("[学生时代模拟器][远程状态栏] V1.6-UI + 首次登记表已启动。");
})();
  </script>

</body>
</html>
