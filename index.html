<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>学生时代模拟器 · 状态栏</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4efe6;
      --paper: rgba(255, 253, 248, 0.96);
      --paper-2: #f8f3ea;
      --ink: #3c3833;
      --muted: #8c8378;
      --line: #ded5c9;
      --accent: #748c78;
      --accent-soft: #e6ede5;
      --warm: #b58a66;
      --danger: #a96f69;
      --shadow: 0 10px 30px rgba(63, 52, 40, 0.08);
    }

    body {
      margin: 0;
      padding: 14px;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.8), transparent 35%),
        var(--bg);
      color: var(--ink);
      font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    /* =========================
       顶部
       ========================= */

    .hero {
      padding: 20px 20px 17px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(
          135deg,
          rgba(230,237,229,.9),
          rgba(255,253,248,.95)
        );
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .date {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    .time {
      margin-top: 3px;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
    }

    .weather {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      color: var(--muted);
      font-size: 12px;
    }

    .location {
      margin-top: 14px;
      font-size: 14px;
    }

    .period {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       人物概要
       ========================= */

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-size: 19px;
      font-weight: 700;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .mood {
      align-self: center;
      padding: 7px 11px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: #536858;
      font-size: 13px;
      white-space: nowrap;
    }

    /* =========================
       核心状态
       ========================= */

    .core {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .core-card {
      padding: 10px;
      border-radius: 12px;
      background: var(--paper-2);
    }

    .core-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .core-value {
      color: var(--ink);
      font-weight: 700;
    }

    .bar {
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: #e5ddd2;
    }

    .bar > div {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s ease;
    }

    /* =========================
       Tab
       ========================= */

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px;
      gap: 5px;
      border-bottom: 1px solid var(--line);
      background: rgba(248,243,234,.65);
    }

    .tab {
      border: 0;
      padding: 9px 6px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }

    .tab:hover {
      background: rgba(255,255,255,.7);
    }

    .tab.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(60,50,40,.06);
      font-weight: 600;
    }

    .content {
      min-height: 220px;
      padding: 18px 20px 21px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       通用布局
       ========================= */

    .section-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .1em;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 11px 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      text-align: center;
    }

    .stat-name {
      color: var(--muted);
      font-size: 10px;
    }

    .stat-value {
      margin-top: 3px;
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .info-list {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .info-label {
      color: var(--muted);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #5c6e60;
      font-size: 11px;
    }

    /* =========================
       关系
       ========================= */

    .relation-list {
      display: grid;
      gap: 9px;
    }

    .relation {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .relation-name {
      font-size: 13px;
      font-weight: 600;
    }

    .relation-type {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .favor {
      align-self: center;
      min-width: 36px;
      padding: 5px 7px;
      border-radius: 8px;
      background: var(--paper-2);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .favor.positive {
      color: #56725d;
    }

    .favor.negative {
      color: var(--danger);
    }

    /* =========================
       背包
       ========================= */

    .item-list {
      display: grid;
      gap: 9px;
    }

    .item {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .item-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .empty {
      padding: 35px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .footer {
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      color: #aaa096;
      text-align: center;
      font-size: 9px;
      letter-spacing: .08em;
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .panel {
        border-radius: 14px;
      }

      .core {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero,
      .summary,
      .core,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <section class="panel">

      <!-- 顶部世界信息 -->
      <header class="hero">

        <div class="hero-top">
          <div>
            <div class="date" id="date">2003-08-27</div>
            <div class="time" id="time">23:45</div>
          </div>

          <div class="weather" id="weather">晴</div>
        </div>

        <div class="location" id="location">
          阳光小学 / 教学楼前报名处
        </div>

        <div class="period" id="period">
          小学新生报名日
        </div>

      </header>


      <!-- 主角概要 -->
      <section class="summary">

        <div>
          <div class="name" id="player-name">未登记</div>

          <div class="meta">
            <span id="player-age">7岁</span>
            ·
            <span id="player-gender">未登记</span>
            ·
            阅历
            <span id="experience">20</span>
          </div>
        </div>

        <div class="mood" id="mood">
          平静释然
        </div>

      </section>


      <!-- 四项核心状态 -->
      <section class="core" id="core-status"></section>


      <!-- Tabs -->
      <nav class="tabs">

        <button class="tab active" data-page="character">
          角色
        </button>

        <button class="tab" data-page="school">
          学校
        </button>

        <button class="tab" data-page="relations">
          关系
        </button>

        <button class="tab" data-page="items">
          背包
        </button>

      </nav>


      <section class="content">

        <!-- 角色 -->
        <div class="page active" id="page-character">

          <h3 class="section-title">主要属性</h3>

          <div class="stat-grid" id="attributes"></div>

          <h3 class="section-title" style="margin-top:20px;">
            当前状态
          </h3>

          <div class="info-list" id="condition-info"></div>

          <div class="tag-list" id="status-tags"></div>

        </div>


        <!-- 学校 -->
        <div class="page" id="page-school">

          <h3 class="section-title">校园信息</h3>

          <div class="info-list" id="school-info"></div>

        </div>


        <!-- 关系 -->
        <div class="page" id="page-relations">

          <h3 class="section-title">家庭</h3>

          <div class="relation-list" id="family-relations"></div>

          <h3 class="section-title" style="margin-top:20px;">
            人物关系
          </h3>

          <div class="relation-list" id="npc-relations"></div>

        </div>


        <!-- 背包 -->
        <div class="page" id="page-items">

          <h3 class="section-title">
            持有物品
          </h3>

          <div class="item-list" id="item-list"></div>

        </div>

      </section>


      <footer class="footer">
        STUDENT ERA · STATUS
      </footer>

    </section>
  </main>


  <script>
// ========================================================
// V1.4B - 远程状态栏数据接收器
//
// 数据来源：
// SillyTavern 酒馆侧状态栏桥接脚本
//
// 通信方式：
// window.postMessage
//
// 原则：
// 1. 远程页面只负责显示
// 2. 不允许远程页面修改 student_sim
// 3. 收到合法 ViewModel 后才覆盖 Demo
// ========================================================


// --------------------------------------------------------
// 01. 暴露渲染函数
//
// 保留这个入口，方便以后调试。
// --------------------------------------------------------

window.renderStudentStatus =
  renderStudentStatus;


// --------------------------------------------------------
// 02. 当前数据状态
// --------------------------------------------------------

let hasReceivedRealData = false;


// --------------------------------------------------------
// 03. 简单验证 ViewModel
//
// 不要求每个字段都存在，
// 但必须至少具备几个核心对象。
// --------------------------------------------------------

function isValidStudentStatusData(data) {

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {
    return false;
  }


  if (
    !data.world ||
    typeof data.world !== "object"
  ) {
    return false;
  }


  if (
    !data.player ||
    typeof data.player !== "object"
  ) {
    return false;
  }


  if (
    !data.condition ||
    typeof data.condition !== "object"
  ) {
    return false;
  }


  if (
    !data.attributes ||
    typeof data.attributes !== "object"
  ) {
    return false;
  }


  return true;
}


// --------------------------------------------------------
// 04. 接收酒馆 postMessage
//
// 约定消息格式：
//
// {
//   source: "student-sim",
//   type: "STATUS_UPDATE",
//   version: "1.4B",
//   payload: ViewModel
// }
// --------------------------------------------------------

window.addEventListener(
  "message",

  event => {

    const message =
      event.data;


    if (
      !message ||
      typeof message !== "object"
    ) {
      return;
    }


    // 只处理属于学生时代模拟器的数据。
    if (
      message.source !== "student-sim"
    ) {
      return;
    }


    // 只处理状态更新。
    if (
      message.type !== "STATUS_UPDATE"
    ) {
      return;
    }


    const data =
      message.payload;


    if (
      !isValidStudentStatusData(data)
    ) {

      console.warn(
        "[学生时代模拟器][远程状态栏] 收到的数据格式不合法：",
        data
      );

      return;
    }


    try {

      renderStudentStatus(
        data
      );


      hasReceivedRealData =
        true;


      document.body.dataset.statusSource =
        "live";


      console.log(
        "[学生时代模拟器][远程状态栏] 已接收真实状态数据：",
        data
      );

    } catch (error) {

      console.error(
        "[学生时代模拟器][远程状态栏] 渲染真实数据失败：",
        error
      );
    }
  }
);


// --------------------------------------------------------
// 05. 告诉父页面：状态栏已经准备完成
//
// 后续酒馆 iframe 加载完成后，
// 可以收到这个消息并立即发送一次真实状态。
// --------------------------------------------------------

function notifyParentReady() {

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(
      {
        source:
          "student-sim-status-ui",

        type:
          "STATUS_UI_READY",

        version:
          "1.4B"
      },
      "*"
    );
  }
}


// --------------------------------------------------------
// 06. 独立浏览器预览模式
//
// 如果直接打开 GitHub Pages，
// 没有酒馆给它发送数据，
// 就继续显示 demoData。
// --------------------------------------------------------

renderStudentStatus(
  demoData
);


document.body.dataset.statusSource =
  "demo";


console.log(
  "[学生时代模拟器][远程状态栏] 当前为 Demo 预览模式。"
);


// --------------------------------------------------------
// 07. 页面准备完成
// --------------------------------------------------------

notifyParentReady();


console.log(
  "[学生时代模拟器][远程状态栏] V1.4B 数据接收器已启动。"
);

  </script>

</body>
</html>
